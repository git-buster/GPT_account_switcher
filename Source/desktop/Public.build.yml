name: Windows build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/**'
      - 'Portable/**'
      - 'Installer/**'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/build.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Source
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build desktop app and synthetic checks
        shell: powershell
        run: |
          ./build-desktop.ps1
          ./build-checks.ps1
      - name: Check synthetic data and launch decisions
        shell: powershell
        run: |
          & ./dist/SwitcherChecks.exe --self-test ./test-output
          $checkExit = $LASTEXITCODE
          Get-Content ./test-output/results.txt
          if ($checkExit -ne 0) {
            if (Test-Path ./test-output/diagnostic.txt) {
              $diagnostic = Get-Content ./test-output/diagnostic.txt -Raw
              $diagnostic.Replace($PWD.Path, '<synthetic source>').Replace($env:USERPROFILE, '<runner profile>')
            }
            throw 'Synthetic checks failed.'
          }
      - name: Package public files
        shell: powershell
        run: |
          ./build-installer.ps1
          python ./validate-installer.py ./release/ChatGPTDesktopSwitcher-0.6.14-Setup.msi --isolated-install
          if ($LASTEXITCODE -ne 0) { throw 'MSI validation failed.' }
          ./package-desktop.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GPT-Switcher
          path: |
            Source/release/*Switcher-*.zip
            Source/release/*Switcher-*-Setup.msi
          if-no-files-found: error
